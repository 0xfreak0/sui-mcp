name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The data-sync job opens its PR with GITHUB_TOKEN, and GitHub does not start
  # workflows for events that token causes, so `pull_request` never fires for
  # it. It dispatches this workflow on the PR branch instead; the run reports
  # the same `check (22)` / `check (24)` checks on the head commit that branch
  # protection requires.
  workflow_dispatch:

# Read-only by default; nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.13 is the floor: node:sqlite (used by the optional store) landed in
        # 22.5 and stopped needing a flag in 22.13. Node 20 went EOL 2026-04-30.
        node-version: [22, 24]
    steps:
      # SHA-pinned; see publish.yml for why. Comments record the tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # --ignore-scripts matches the publish workflow and the posture this
      # project is developed under. If a dependency ever genuinely needs an
      # install hook, CI should be the place that fails first, not last.
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      # Build before testing: the packaging tests run `npm pack --dry-run`,
      # which reports what's on disk, so they need a real dist/ to inspect.
      # It also means CI verifies the build actually emits, not just typechecks.
      - run: npm run build
      - run: npm test
