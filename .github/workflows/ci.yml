name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Build before testing: the packaging tests run `npm pack --dry-run`,
      # which reports what's on disk, so they need a real dist/ to inspect.
      # It also means CI verifies the build actually emits, not just typechecks.
      - run: npm run build
      - run: npm test
