name: Leak scan

# Backstop for `.githooks/`. Git does not clone hooks and `--no-verify` skips
# them, so the local hook alone cannot keep a session URL out of the repo.
#
# This checks only `.githooks/patterns` — the TRACKED list. The private list
# (`patterns.local`) is gitignored precisely because publishing it would
# publish what it protects, so CI cannot see it and that half rests on the
# local hook. Stated rather than silently half-enforced.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned; see publish.yml for why. Comments record the tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history: a leak in an older commit MESSAGE is still published,
          # and a shallow clone cannot see it.
          fetch-depth: 0

      - name: Commit messages
        run: |
          # On a PR, check what this PR adds. On a push to main, check the
          # commits just pushed.
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            range="${{ github.event.before }}..HEAD"
          fi
          # A first push or a force-push can leave an unusable range.
          git rev-list "$range" >/dev/null 2>&1 || range="HEAD~20..HEAD"
          git rev-list "$range" >/dev/null 2>&1 || range="HEAD"
          echo "Scanning commit messages in $range"
          fail=0
          for sha in $(git rev-list "$range"); do
            if ! git log -1 --format='%B' "$sha" | ./.githooks/leak-scan.sh "commit message of $sha"; then
              fail=1
            fi
          done
          exit $fail

      - name: Tracked file contents
        run: |
          fail=0
          # -I skips binaries; the scanner is line-oriented text matching.
          for f in $(git ls-files); do
            if [ -f "$f" ] && ! grep -Iq . "$f" 2>/dev/null; then continue; fi
            # The pattern files and this workflow legitimately contain the
            # patterns themselves.
            case "$f" in .githooks/patterns*|.github/workflows/leak-scan.yml) continue ;; esac
            if ! ./.githooks/leak-scan.sh "$f" < "$f"; then fail=1; fi
          done
          exit $fail
