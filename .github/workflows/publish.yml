name: Publish

# Releases are cut by pushing a version tag. Everything below runs from a clean
# checkout, which sidesteps the two ways a local `npm publish` goes wrong: a
# stale dist/ from a build that predates your last edit, and `ignore-scripts=true`
# in a personal .npmrc silently skipping the prepublishOnly guard.
on:
  push:
    tags: ["v*"]
  # Manual dry run: exercises checkout, install, build, test and prints auth
  # diagnostics, then stops before anything is published. Lets release-auth
  # problems be debugged without burning a version tag per attempt.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything except the publish steps"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Used twice: npm trusted publishing and `mcp-publisher login github-oidc`.
      # Neither needs a stored secret.
      id-token: write
      contents: read

    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is a mutable pointer:
      # whoever controls the action's repo can move v5 to different code, and
      # this job can mint an npm publish token. Comments record the tag the SHA
      # corresponded to when pinned.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # npm trusted publishing requires npm >= 11.5.1 / Node >= 22.14.
          node-version: "24"
          # Deliberately NO registry-url. That input makes setup-node write an
          # .npmrc and set NODE_AUTH_TOKEN to the literal placeholder
          # "XXXXX-XXXXX-XXXXX-XXXXX" when no token is supplied. npm then finds
          # configured auth, sends the placeholder, and never attempts the OIDC
          # exchange — which fails as a 404 on PUT. Leaving it out is what makes
          # trusted publishing work.
          cache: npm

      # --ignore-scripts: this job holds `id-token: write`, i.e. the ability to
      # mint an npm publish credential. Running arbitrary dependency install
      # hooks in that context is the shortest path from a compromised
      # transitive dep to a malicious release. Nothing here needs them.
      - run: npm ci --ignore-scripts

      # The tag is the source of truth for a release. If it disagrees with
      # package.json, stop here rather than publishing a version nobody meant to
      # cut — the registry would also reject the mismatched server.json later,
      # but by then npm has already been published and npm versions are permanent.
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION does not match package.json version $PKG_VERSION."
            echo "Run 'npm run set-version -- $TAG_VERSION' and re-tag."
            exit 1
          fi

      - run: npx tsc --noEmit
      # Build before test, not after: the packaging tests run `npm pack --dry-run`
      # and assert on what it would ship, so they need a real dist/ on disk.
      # Same ordering as ci.yml — keep the two in step.
      - run: npm run build
      - run: npm test

      # No NODE_AUTH_TOKEN and no .npmrc: npm detects the OIDC environment and
      # exchanges a short-lived token. Requires trusted publishing to be
      # configured for this package on npmjs.com (Settings -> Trusted publisher
      # -> this repo + workflow file).
      #
      # --provenance attaches a signed Sigstore attestation binding the tarball
      # to this commit and workflow run, which anyone can verify with
      # `npm audit signatures`. It is the strongest signal users have that a
      # release came from this repo and not from a stolen credential, so it is
      # explicit rather than left to whatever the default happens to be.
      # npm's OIDC path is silent about why it didn't engage — a misconfigured
      # trusted publisher and a missing id-token permission both surface as a
      # generic ENEEDAUTH at publish time. This prints the three things that
      # distinguish them, without leaking the token itself.
      - name: Diagnose publish auth
        run: |
          echo "node        $(node --version)"
          echo "npm         $(npm --version)   (trusted publishing needs >= 11.5.1)"
          echo "registry    $(npm config get registry)"
          echo "userconfig  ${NPM_CONFIG_USERCONFIG:-<unset>}"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}${NODE_AUTH_TOKEN:-no}"
          echo "OIDC request URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-no (id-token: write not in effect)}"
          echo "repo        ${GITHUB_REPOSITORY}"
          echo "workflow    ${GITHUB_WORKFLOW_REF}"
          echo "--- npm's view of auth ---"
          npm whoami || echo "(npm whoami failed — expected when only OIDC is available)"

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance

      # Pinned by version AND checksum. The upstream one-liner pipes
      # `releases/latest` straight into tar, which means an unreviewed binary
      # runs in a job that can publish to npm and to the MCP Registry — the
      # download would silently change under us the moment upstream cuts a
      # release. Digests come from the release assets API.
      #
      # To bump: set MCP_PUBLISHER_VERSION, then
      #   gh api repos/modelcontextprotocol/registry/releases/tags/$VER \
      #     --jq '.assets[] | select(.name|test("linux_amd64.tar.gz$")) | .digest'
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          # runs-on is ubuntu-latest, so the platform is fixed; no uname guessing.
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL "$url" -o mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz

      # login is safe to exercise in a dry run and confirms the registry side of
      # OIDC independently of npm's, which narrows down where auth is failing.
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: ${{ !inputs.dry_run }}
        run: ./mcp-publisher publish

      # Installs from npm in a clean directory and completes an MCP handshake,
      # so a tarball that publishes but won't start fails the release loudly
      # instead of sitting broken on the registry.
      - name: Verify the published package installs and starts
        if: ${{ !inputs.dry_run }}
        run: npm run verify:published

  # Kept a separate job so `publish` keeps `contents: read`. That job holds
  # `id-token: write` for npm and the MCP registry; a single token that can both
  # publish releases and write to the repo is a larger blast radius than either
  # permission is on its own.
  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # A tag is a git ref and shows nowhere on the repo page. A release renders
      # in the sidebar and has an Atom feed, which is the difference between a
      # project that looks maintained and one that looks abandoned.
      - name: Create GitHub release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          notes=$(awk -v v="$version" '
            $0 == "## " v || index($0, "## " v " ") == 1 { f = 1; next }
            f && /^## / { exit }
            f { print }
          ' CHANGELOG.md)
          # Fail loudly: a release whose notes silently came out empty is worse
          # than no release, because nobody goes back to check.
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::No CHANGELOG.md section found for $version"
            exit 1
          fi
          printf '%s\n\n---\n\n```\nnpx sui-analytics-mcp@%s\n```\n' "$notes" "$version" > /tmp/notes.md
          # --latest is explicit. GitHub otherwise infers it from creation date,
          # which is wrong the moment an older tag is released after a newer one.
          gh release create "$TAG" --title "$version" --notes-file /tmp/notes.md --latest
